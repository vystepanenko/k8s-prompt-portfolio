apiVersion: v1
kind: Pod
metadata:
  name: app-two-containers
spec:
  volumes:
    - name: html
      emptyDir: {}
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
          name: http
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
    - name: writer
      image: debian:12-slim
      command:
        - /bin/sh
        - -c
      args:
        - |
          while true; do
            date >> /html/index.html
            sleep 1
          done
      volumeMounts:
        - name: html
          mountPath: /html
