# Findings (original: app-cronjob.yaml):
# 1. [deprecated] batch/v1beta1 CronJob removed in 1.25 -> use
#    batch/v1 for Kubernetes 1.34.
# 2. [reliability] missing concurrencyPolicy and history limits ->
#    jobs may overlap and unbounded history accumulates.
# 3. [security] container lacks securityContext constraints and
#    uses unpinned image tag.
# 4. [best-practice] no resource requests/limits -> scheduler
#    cannot place pod reliably.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-cronjob
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: bash:5.2
              command: ["echo", "Hello world"]
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
