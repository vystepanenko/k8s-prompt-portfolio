apiVersion: v1
kind: Secret
metadata:
  name: mysecret1
type: Opaque
stringData:
  username: change-me
  password: change-me
---
apiVersion: v1
kind: Pod
metadata:
  name: app-secret-env
spec:
  restartPolicy: Never
  containers:
    - name: mycontainer
      image: redis:7.4
      env:
        - name: SECRET_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysecret1
              key: username
        - name: SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysecret1
              key: password
