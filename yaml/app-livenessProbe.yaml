apiVersion: v1
kind: Pod
metadata:
  name: app-liveness-probe
  labels:
    app: demo
spec:
  containers:
    - name: app
      image: gcr.io/smartcity-gl/demo:v1.0.1
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        timeoutSeconds: 1
        periodSeconds: 10
        failureThreshold: 3
