# Findings (original: app-secret-env.yaml):
# 1. [security] Passing credentials in env vars leaks sensitive data
#    via process lists and pod specs -> mount Secret as volume.
# 2. [reliability] secretKeyRef without optional setting can block
#    pod startup if Secret mysecret1 is missing.
# 3. [security] Unpinned image tag 'redis' -> pin to specific tag.
# 4. [best-practice] Missing resource requests and limits.
# 5. [security] Missing securityContext hardening options.
apiVersion: v1
kind: Pod
metadata:
  name: app-secret-env
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: mycontainer
    image: redis:7.4.2-alpine
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"
    env:
      - name: SECRET_USERNAME
        valueFrom:
          secretKeyRef:
            name: mysecret1
            key: username
            optional: false
      - name: SECRET_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysecret1
            key: password
            optional: false
  restartPolicy: Never
