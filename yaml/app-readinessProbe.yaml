apiVersion: v1
kind: Pod
metadata:
  name: app-readiness-probe
  labels:
    app: demo
spec:
  containers:
    - name: app
      image: gcr.io/smartcity-gl/harmonic:v2.0.2
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        timeoutSeconds: 1
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /ready
          port: http
        initialDelaySeconds: 0
        periodSeconds: 2
        failureThreshold: 3
        successThreshold: 1
